name: build-macos

on:
  workflow_dispatch:
    inputs:
      arch:
        description: macOS architecture to build
        required: true
        default: both
        type: choice
        options:
          - both
          - arm64
          - x86_64

jobs:
  arm64:
    if: inputs.arch == 'both' || inputs.arch == 'arm64'
    uses: ./.github/workflows/build-macos-reusable.yml
    with:
      arch: aarch64
      runner: macos-latest
      bundle_arch: aarch64

  x86_64:
    if: inputs.arch == 'both' || inputs.arch == 'x86_64'
    uses: ./.github/workflows/build-macos-reusable.yml
    with:
      arch: x86_64
      runner: macos-15-intel
      bundle_arch: x64

