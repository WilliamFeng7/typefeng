name: build-macos-artifact

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      bundle_arch:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: openless-all/app
    env:
      CI: 'true'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openless-all/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build TypeFeng app
        run: npm run tauri -- build --ci --config src-tauri/tauri.macos.conf.json -- --locked

      - name: Verify architecture and collect deliverables
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/TypeFeng.app"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          test -d "$app"
          test -n "$(find "$dmg_dir" -maxdepth 1 -name "TypeFeng_*_${{ inputs.bundle_arch }}.dmg" -print -quit)"
          binary="$app/Contents/MacOS/openless"
          test -f "$binary"
          file "$binary" | tee architecture.txt
          grep -q "${{ inputs.arch }}" architecture.txt
          mkdir -p deliverables
          cp -R "$app" deliverables/
          find "$dmg_dir" -maxdepth 1 -name "TypeFeng_*_${{ inputs.bundle_arch }}.dmg" -exec cp {} deliverables/ \;
          shasum -a 256 deliverables/*.dmg > deliverables/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TypeFeng-macos-${{ inputs.arch }}
          path: openless-all/app/deliverables/
          if-no-files-found: error
